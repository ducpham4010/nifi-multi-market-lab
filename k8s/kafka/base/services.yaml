apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
  - name: internal
    port: 9092
  - name: controller
    port: 9093
---
# Bootstrap address for in-cluster clients (NiFi).
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
  - name: internal
    port: 9092
    targetPort: internal
---
# LAN access (optional tooling). nodePort is set by each overlay.
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kafka
  ports:
  - name: external
    port: 9094
    targetPort: external
