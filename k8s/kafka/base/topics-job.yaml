# Idempotent topic creation. The finished Job deletes itself, so every
# `kubectl apply -k` (deploy.sh) recreates it and re-checks the topics.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init-topics
        app.kubernetes.io/part-of: nifi-market-lab
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: init-topics
        image: apache/kafka:3.9.1
        imagePullPolicy: IfNotPresent
        env:
        - name: TOPICS
          value: trips
        - name: KAFKA_HEAP_OPTS
          value: -Xmx192m
        command: [/bin/bash, -ec]
        args:
        - |
          for topic in $TOPICS; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
              --create --if-not-exists --topic "$topic" --partitions 3 --replication-factor 1
          done
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 384Mi
