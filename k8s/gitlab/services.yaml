# In-cluster API/Git endpoint used by NiFi Registry Clients:
#   http://gitlab.gitlab.svc.cluster.local/
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  labels:
    app.kubernetes.io/name: gitlab
spec:
  selector:
    app.kubernetes.io/name: gitlab
  ports:
  - name: http
    port: 80
    targetPort: http
---
# Git over SSH from the LAN: ssh://git@gitlab.192.168.102.4.sslip.io:31022
apiVersion: v1
kind: Service
metadata:
  name: gitlab-ssh
  labels:
    app.kubernetes.io/name: gitlab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gitlab
  ports:
  - name: ssh
    port: 22
    targetPort: ssh
    nodePort: 31022
