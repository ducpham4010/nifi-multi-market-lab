# GitLab CE Omnibus as one StatefulSet. The cloud-native Helm chart needs far
# more memory than this shared lab node has; Omnibus keeps the same GitLab
# features (API, MR, protected branches, Project Access Tokens).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab
  labels:
    app.kubernetes.io/name: gitlab
spec:
  serviceName: gitlab
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab
        app.kubernetes.io/part-of: nifi-market-lab
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
      - name: gitlab
        image: gitlab/gitlab-ce:18.2.1-ce.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        - name: ssh
          containerPort: 22
        env:
        - name: GITLAB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitlab-root
              key: password
        - name: GITLAB_OMNIBUS_CONFIG
          value: |
            external_url 'http://gitlab.192.168.102.4.sslip.io:31080'
            nginx['listen_port'] = 80
            nginx['listen_https'] = false
            nginx['status']['enable'] = false
            gitlab_rails['gitlab_shell_ssh_port'] = 31022
            gitlab_rails['monitoring_whitelist'] = ['127.0.0.0/8']
            letsencrypt['enable'] = false
            prometheus_monitoring['enable'] = false
            registry['enable'] = false
            gitlab_rails['registry_enabled'] = false
            gitlab_kas['enable'] = false
            puma['worker_processes'] = 0
            sidekiq['concurrency'] = 5
        startupProbe:
          exec:
            command: [curl, -fsS, -o, /dev/null, http://127.0.0.1/-/readiness]
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 90
        readinessProbe:
          exec:
            command: [curl, -fsS, -o, /dev/null, http://127.0.0.1/-/readiness]
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command: [curl, -fsS, -o, /dev/null, http://127.0.0.1/-/liveness]
          periodSeconds: 60
          timeoutSeconds: 15
          failureThreshold: 10
        resources:
          requests:
            cpu: 500m
            memory: 2560Mi
          limits:
            memory: 5Gi
        volumeMounts:
        - name: config
          mountPath: /etc/gitlab
        - name: data
          mountPath: /var/opt/gitlab
        - name: logs
          mountPath: /var/log/gitlab
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: logs
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: config
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi
