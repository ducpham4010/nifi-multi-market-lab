# Workload identity of this NiFi instance. Vault's Kubernetes auth role
# nifi-<market> is bound to (this ServiceAccount, this namespace) only.
# NiFi never calls the Kubernetes API, so the default API token is not mounted;
# pods mount a short-lived projected token with audience "vault" instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nifi
automountServiceAccountToken: false
