# Staging authoring instance: writes snapshots to GitLab branch staging (Developer PrAT).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nifi-stag
resources:
- ../base
configMapGenerator:
# Browser hostname (cookie isolation), Host-header allowlist and certificate SANs.
- name: nifi-env
  literals:
  - NIFI_BROWSER_HOST=nifi-stag.192.168.102.4.sslip.io
  - NIFI_WEB_PROXY_HOST=192.168.102.4:31443,nifi-stag.192.168.102.4.sslip.io:31443,nifi-stag.192.168.102.4.sslip.io,nifi.nifi-stag.svc:8443,nifi.nifi-stag.svc.cluster.local:8443,nifi-0.nifi-headless.nifi-stag.svc.cluster.local:8443
  - NIFI_TLS_EXTRA_SANS=dns:nifi.nifi-stag.svc,dns:nifi.nifi-stag.svc.cluster.local,dns:nifi-0.nifi-headless.nifi-stag.svc.cluster.local
# Vault Kubernetes-auth role, secret paths and Registry Client settings for the sync jobs.
- name: nifi-sync-env
  literals:
  - VAULT_ADDR=http://vault.vault-vn.svc.cluster.local:8200
  - VAULT_ROLE=nifi-stag
  - VAULT_PARAMS_PATH=kv/staging
  - VAULT_REGISTRY_TOKEN_PATH=kv/gitlab-registry/staging
  - REGISTRY_CLIENT_NAME=gitlab-staging
  - REGISTRY_BRANCH=staging
  - GITLAB_API_URL=http://gitlab.gitlab.svc.cluster.local/
  - GITLAB_NAMESPACE=data360
  - GITLAB_PROJECT=flows-nifi
  - GITLAB_REPOSITORY_PATH=flows
patches:
- target:
    kind: TLSRoute
    name: nifi
  patch: |-
    - op: replace
      path: /spec/hostnames/0
      value: nifi-stag.192.168.102.4.sslip.io
